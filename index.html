<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ff7043" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <title>米果哥小小賽車手 - Little Kart</title>
  <script type="module" crossorigin src="./assets/index-Bu7P7Rma.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-qwMuNPdE.css">
</head>
<body>
  <div id="game-container"></div>

  <!-- 選單畫面 -->
  <div id="menu-overlay" class="overlay">
    <h1>🏎️ 米果哥小小賽車手</h1>
    <div id="hero-avatar-box" class="hero-box">
      <img id="hero-preview" class="hero-preview hidden" alt="米果哥" />
      <label for="hero-upload" class="upload-btn">📸 放入米果哥照片當主角</label>
      <button id="hero-remove" class="upload-btn hidden" style="background:#ef5350;color:#fff;border:none;box-shadow:0 4px 0 #c62828;">❌ 移除</button>
      <input id="hero-upload" type="file" accept="image/*" class="hidden" />
    </div>
    <div class="section-label">選一台可愛車車</div>
    <div id="kart-choices" class="card-row"></div>
    <div class="section-label">選車車顏色</div>
    <div id="color-choices" class="card-row"></div>
    <div class="section-label">選一條賽道</div>
    <div id="track-choices" class="card-row"></div>
    <button id="start-btn" class="start-btn">出發！</button>
  </div>

  <!-- 遊戲中 HUD -->
  <div id="hud" class="hidden">
    <div id="lap-badge">🏁 第 1 / 2 圈</div>
    <div id="coin-badge">⭐ 0</div>
    <button id="mute-btn" class="mute-btn">🔊</button>
    <div id="countdown"></div>
    <div id="touch-left" class="touch-zone"><div class="steer-hint">⬅️</div></div>
    <div id="touch-right" class="touch-zone"><div class="steer-hint">➡️</div></div>
    <button id="item-btn" class="hidden">🍄</button>
  </div>

  <!-- 過關慶祝畫面 -->
  <div id="finish-overlay" class="overlay hidden">
    <div style="font-size: 3.5rem; margin-bottom: 8px;">🎊🌟🏆🌟🎊</div>
    <h1>🎉 太棒了！你贏了！🏆</h1>
    <button id="replay-btn" class="start-btn">再玩一次！</button>
  </div>

</body>
</html>
