<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ff7043" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <title>米果哥小小賽車手 - Little Kart</title>
</head>
<body>
  <div id="game-container"></div>

  <!-- 選單畫面 -->
  <div id="menu-overlay" class="overlay menu-showroom">
    <h1>🏎️ 米果哥小小賽車手</h1>
    <div id="showroom-spacer" aria-hidden="true"></div>
    <div id="hero-avatar-box" class="hero-box">
      <img id="hero-preview" class="hero-preview hidden" alt="米果哥" />
      <label for="hero-upload" class="upload-btn">📸 放入米果哥照片當主角</label>
      <button id="hero-remove" class="upload-btn hidden" style="background:#ef5350;color:#fff;border:none;box-shadow:0 4px 0 #c62828;">❌ 移除</button>
      <input id="hero-upload" type="file" accept="image/*" class="hidden" />
    </div>
    <div class="section-label">選一台可愛車車</div>
    <div id="kart-choices" class="card-row"></div>
    <div class="section-label">選車車顏色</div>
    <div id="color-choices" class="card-row"></div>
    <div class="section-label">選一條賽道</div>
    <div id="track-choices" class="card-row"></div>
    <button id="start-btn" class="start-btn">出發！</button>
  </div>

  <!-- 遊戲中 HUD -->
  <div id="hud" class="hidden">
    <div id="speed-lines" class="hidden"></div>
    <div id="lap-badge">🏁 第 1 / 2 圈</div>
    <div id="coin-badge">⭐ 0</div>
    <div id="rank-badge">🏆 第 1 / 8 名</div>
    <button id="pause-btn" class="pause-btn" aria-label="暫停">⏸️</button>
    <button id="mute-btn" class="mute-btn" aria-label="靜音">🔊</button>
    <canvas id="minimap" width="120" height="120"></canvas>
    <div id="speed-badge">0 km/h</div>
    <div id="action-toast" class="hidden"></div>
    <div id="countdown"></div>
    <div id="touch-left" class="touch-zone"><div class="steer-hint">⬅️</div></div>
    <div id="touch-right" class="touch-zone"><div class="steer-hint">➡️</div></div>
    <button id="item-btn" class="hidden">🍄</button>
  </div>

  <!-- 暫停選單 -->
  <div id="pause-overlay" class="overlay pause-overlay hidden">
    <h1>⏸️ 遊戲暫停</h1>
    <div style="display: flex; flex-direction: column; gap: 14px; align-items: center; margin-top: 8px;">
      <button id="resume-btn" class="start-btn">▶️ 繼續比賽</button>
      <button id="restart-btn" class="start-btn" style="background: #ffd54f; color: #d84315; box-shadow: 0 6px 0 #fbc02d;">🔄 重玩這關</button>
      <button id="pause-home-btn" class="start-btn" style="background: #4fc3f7; box-shadow: 0 6px 0 #0288d1;">🏠 回首頁</button>
    </div>
  </div>

  <!-- 過關與故事劇情畫面 -->
  <div id="finish-overlay" class="overlay hidden">
    <div style="font-size: 3.5rem; margin-bottom: 8px;">🎊🌟🏆🌟🎊</div>
    <h1 id="finish-title">🎉 太棒了！過關囉！🏆</h1>
    <div id="finish-stats" class="finish-stats"></div>
    <p id="story-text" style="font-size: 1.3rem; font-weight: bold; color: #37474f; max-width: 520px; text-align: center; margin: 8px 0 16px;"></p>
    <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
      <button id="next-stage-btn" class="start-btn">➡️ 繼續下一關！</button>
      <button id="replay-btn" class="start-btn" style="background: #4fc3f7; box-shadow: 0 6px 0 #0288d1;">🏠 回首頁</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
